<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tono 432 Hz</title>
  <style>
    body { font-family: sans-serif; display:flex; gap:1rem; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:#e2e8f0; }
    button { padding:.6rem 1.2rem; border:none; border-radius:.5rem; cursor:pointer; font-size:1rem; }
    #play { background:#22c55e; color:#0f172a; }
    #stop { background:#ef4444; color:white; }
  </style>
</head>
<body>
  <div>
    <h1>🎧 Tono 432 Hz</h1>
    <p>Presiona “Reproducir” para escuchar un seno a 432 Hz.</p>
    <button id="play">▶️ Reproducir</button>
    <button id="stop" disabled>⏹️ Detener</button>
  </div>
  <script>
    let audioCtx;
    let osc;
    let gain;

    const playBtn = document.getElementById('play');
    const stopBtn = document.getElementById('stop');

    playBtn.onclick = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      osc.type = 'sine';           // onda seno
      osc.frequency.value = 432;    // 432 Hz
      gain.gain.value = 0.15;       // volumen bajito
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      playBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      if (osc) {
        osc.stop();
        osc.disconnect();
      }
      playBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>
</body>
</html>
